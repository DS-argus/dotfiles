[flavor]
dark  = "nord"

[cmp]
icon_file = "󰈔"
icon_folder = "󰉋"
icon_command = "󰘳"

# 아이콘 색은 nord flavor(flavors/nord.yazi/flavor.toml)의 [filetype] 규칙과 맞춘다.
# image/* → nord7, {audio,video}/* → nord13, archive → nord15,
# document → nord14, link → nord15, dir → nord9
[icon]
prepend_dirs = [
	{ name = ".config", text = "󰒓", fg = "#81A1C1" },  # nord9  dir
	{ name = ".git", text = "󰊢", fg = "#BF616A" },     # nord11 git은 빨강으로 구분
	{ name = "Desktop", text = "󰟀", fg = "#81A1C1" },  # nord9  dir
	{ name = "Documents", text = "󰈙", fg = "#A3BE8C" },# nord14 document
	{ name = "Downloads", text = "󰉍", fg = "#EBCB8B" },# nord13
	{ name = "Pictures", text = "󰋩", fg = "#8FBCBB" }, # nord7  image
]

prepend_files = [
	{ name = ".gitignore", text = "󰊢", fg = "#BF616A" },# nord11 .git과 통일
	{ name = "Dockerfile", text = "󰡨", fg = "#88C0D0" },# nord8
	{ name = "README.md", text = "󰍔", fg = "#88C0D0" }, # nord8  md와 통일
]

prepend_exts = [
	{ name = "md", text = "󰍔", fg = "#88C0D0" },   # nord8
	{ name = "lua", text = "󰢱", fg = "#81A1C1" },  # nord9
	{ name = "toml", text = "󰰤", fg = "#EBCB8B" }, # nord13
	{ name = "yaml", text = "󰈙", fg = "#EBCB8B" }, # nord13
	{ name = "yml", text = "󰈙", fg = "#EBCB8B" },  # nord13
	{ name = "json", text = "󰘦", fg = "#A3BE8C" }, # nord14
	{ name = "lock", text = "󰌾", fg = "#B48EAD" }, # nord15
	{ name = "png", text = "󰋩", fg = "#8FBCBB" },  # nord7  image/*
	{ name = "jpg", text = "󰋩", fg = "#8FBCBB" },  # nord7  image/*
	{ name = "jpeg", text = "󰋩", fg = "#8FBCBB" }, # nord7  image/*
	{ name = "svg", text = "󰜡", fg = "#8FBCBB" },  # nord7  image/*
	{ name = "zip", text = "󰗄", fg = "#B48EAD" },  # nord15 archive
	{ name = "tar", text = "󰗄", fg = "#B48EAD" },  # nord15 archive
	{ name = "gz", text = "󰗄", fg = "#B48EAD" },   # nord15 archive
	{ name = "7z", text = "󰗄", fg = "#B48EAD" },   # nord15 archive
	{ name = "mp3", text = "󰎆", fg = "#EBCB8B" },  # nord13 audio/*
	{ name = "wav", text = "󰎆", fg = "#EBCB8B" },  # nord13 audio/*
	{ name = "mp4", text = "󰕧", fg = "#EBCB8B" },  # nord13 video/*
]

prepend_conds = [
	{ if = "hidden & dir", text = "󰉖", fg = "#4C566A" },# nord3  muted
	{ if = "hidden", text = "󰘓", fg = "#4C566A" },      # nord3  muted
	{ if = "link", text = "", fg = "#B48EAD" },        # nord15 link
	{ if = "orphan", text = "", fg = "#BF616A" },      # nord11
	{ if = "exec & !dir", text = "󰆍", fg = "#A3BE8C" }, # nord14
	{ if = "dir", text = "󰉋", fg = "#81A1C1" },         # nord9  dir
]

[git]
untracked = { fg = "#B48EAD" }              # 보라: 추적되지 않음
unstaged  = { fg = "#EBCB8B" }              # 노랑: stage 전 수정
staged    = { fg = "#A3BE8C" }              # 초록: staged 수정
added     = { fg = "#A3BE8C" }              # 초록: staged 새 파일
deleted   = { fg = "#BF616A" }              # 빨강: 삭제
updated   = { fg = "#D08770", bold = true } # 굵은 주황: 충돌

untracked_sign = "? "
unstaged_sign  = "M "
staged_sign    = "S "
added_sign     = "A "
deleted_sign   = "D "
updated_sign   = "! "
ignored_sign   = ""
unknown_sign   = ""
clean_sign     = ""
