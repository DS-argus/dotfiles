# Floating tools
unbind -q y
unbind -q Y
unbind -q O
unbind -q -T floating b
unbind -q -T floating c
unbind -q -T floating d
unbind -q -T floating g
unbind -q -T floating o
unbind -q -T floating x
unbind -q -T floating y

# Popup titles use @popup-title / @popup-title-end from tmux.conf.
bind f display-menu -M \
  -T "#[align=centre]#[fg=#2e3440,bg=#88c0d0,bold] Floating #[default]" \
  -x C -y C \
  -s "fg=#d8dee9,bg=default" \
  -S "fg=#4c566a,bg=default" \
  -H "fg=#2e3440,bg=#81a1c1,bold" \
  "Git          lazygit" g "display-popup -d '#{pane_current_path}' -w80% -h80% -T '#{E:@popup-title}󰊢 lazygit#{E:@popup-title-end}' -E lazygit" \
  "Docker       lazydocker" d "display-popup -d '#{pane_current_path}' -w80% -h80% -T '#{E:@popup-title}󰡨 lazydocker#{E:@popup-title-end}' -E lazydocker" \
  "Monitor      btop" b "display-popup -w80% -h80% -T '#{E:@popup-title}󰄨 btop#{E:@popup-title-end}' -E btop" \
  "Packages     gpk" p "display-popup -w80% -h80% -T '#{E:@popup-title}󰏗 gpk#{E:@popup-title-end}' -E gpk" \
  "" "" "" \
  "Codex        session root" x "run-shell '\
    ROOT=\"#{session_path}\"; \
    SESSION=\"codex-\$(printf \"%s\" \"\$ROOT\" | md5sum | cut -c1-8)\"; \
    tmux has-session -t \"\$SESSION\" 2>/dev/null || \
    tmux new-session -d -s \"\$SESSION\" -c \"\$ROOT\" \"codex --dangerously-bypass-approvals-and-sandbox\"; \
    tmux display-popup -d \"\$ROOT\" -w80% -h80% -T \"#{E:@popup-title}󰚩 codex#{E:@popup-title-end}\" -E \"tmux attach-session -t \$SESSION\"'" \
  "Claude       session root" c "run-shell '\
    ROOT=\"#{session_path}\"; \
    SESSION=\"claude-\$(printf \"%s\" \"\$ROOT\" | md5sum | cut -c1-8)\"; \
    tmux has-session -t \"\$SESSION\" 2>/dev/null || \
    tmux new-session -d -s \"\$SESSION\" -c \"\$ROOT\" \"claude --dangerously-skip-permissions\"; \
    tmux display-popup -d \"\$ROOT\" -w80% -h80% -T \"#{E:@popup-title}󰚩 claude#{E:@popup-title-end}\" -E \"tmux attach-session -t \$SESSION\"'" \
  "Claude       Obsidian vault" o "run-shell '\
    ROOT=\"\$OBSIDIAN_VAULT_DIR\"; \
    [ -n \"\$ROOT\" ] || ROOT=\"\$HOME/Desktop/Obsidian/Argus\"; \
    SESSION=\"claude-obsidian-\$(printf \"%s\" \"\$ROOT\" | md5sum | cut -c1-8)\"; \
    tmux has-session -t \"\$SESSION\" 2>/dev/null || \
    tmux new-session -d -s \"\$SESSION\" -c \"\$ROOT\" \"claude --dangerously-skip-permissions\"; \
    tmux display-popup -d \"\$ROOT\" -w80% -h80% -T \"#{E:@popup-title}󰮩 claude: obsidian#{E:@popup-title-end}\" -E \"tmux attach-session -t \$SESSION\"'" \
  "" "" "" \
  "Peek         any pane" a "run-shell 'tmux display-popup -w80% -h80% -T \"#{E:@popup-title}󰍉 peek#{E:@popup-title-end}\" -E \"\$HOME/.config/tmux/scripts/peek-pane.sh #{window_id}\"'"
